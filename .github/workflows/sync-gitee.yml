name: Sync to Gitee

# GitHub → Gitee 自动同步镜像：
# 每次 push 到 main 后，自动把仓库推送到 gitee.com/coreyleung/openchronicle
# 需要仓库 Secrets 配置 GITEE_TOKEN（Gitee 私人令牌，可只勾选 projects 权限）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Mirror main to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee (★ 安全同步：非 force，领先则拒绝覆盖)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret 未配置"
            exit 1
          fi
          URL="https://coreyleung:${GITEE_TOKEN}@gitee.com/coreyleung/mtm.git"
          git fetch "$URL" main:refs/remotes/gitee-sync/main || true
          # ★ 若 Gitee 领先（有人直推过 Gitee），拒绝覆盖 —— 这是期望行为，不静默销毁对方提交
          if git rev-parse --verify gitee-sync/main >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor gitee-sync/main HEAD; then
              echo "::error::Gitee 领先于 GitHub —— 检测到 Gitee 上有 GitHub 没有的提交。"
              echo "::error::已拒绝覆盖（旧版用 --force 会静默销毁这些提交）。"
              echo "::error::请先 fetch Gitee 并合并到 GitHub 后再推送。"
              git log --oneline HEAD..gitee-sync/main | head -20 || true
              exit 1
            fi
          fi
          git push "$URL" main:main
